# Pipeline: build -> uat -> calidad -> produccion
# Cada etapa de despliegue usa un GitHub Environment (Settings > Environments),
# donde se pueden configurar aprobaciones manuales y secretos propios.

name: CI/CD - CreditFlow-WEB

on:
  push:
    branches:
      - main
    paths:
      - 'CreditFlow.Web/**'
  workflow_dispatch:

env:
  APP_NAME: CreditFlow-WEB

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build CreditFlow.Web/CreditFlow.Web.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish CreditFlow.Web/CreditFlow.Web.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  uat:
    runs-on: windows-latest
    needs: build
    environment: uat
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7B773E06A1C14F70AF5542688F9D77AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E14B51E8E576423AB23166C2DCD1A72C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_85FDCF5CF96F46889B7247759847F82E }}

      - name: Deploy to UAT
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'uat'
          package: .

  calidad:
    runs-on: windows-latest
    needs: uat
    environment: calidad
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7B773E06A1C14F70AF5542688F9D77AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E14B51E8E576423AB23166C2DCD1A72C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_85FDCF5CF96F46889B7247759847F82E }}

      - name: Deploy to Calidad
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'calidad'
          package: .

  produccion:
    runs-on: windows-latest
    needs: calidad
    environment: produccion
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7B773E06A1C14F70AF5542688F9D77AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E14B51E8E576423AB23166C2DCD1A72C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_85FDCF5CF96F46889B7247759847F82E }}

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'Production'
          package: .
