# Pipeline: build -> uat -> calidad -> produccion
# Cada etapa de despliegue usa un GitHub Environment (Settings > Environments),
# donde se pueden configurar aprobaciones manuales y secretos propios.

name: CI/CD - CreditFlow-API

on:
  push:
    branches:
      - main
    paths:
      - 'CreditFlow.API/**'
  workflow_dispatch:

env:
  APP_NAME: CreditFlow-API

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build CreditFlow.API/CreditFlow.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish CreditFlow.API/CreditFlow.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  uat:
    runs-on: windows-latest
    needs: build
    environment: uat
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8DD3218090484411BF77757E7CFF0774 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8F2DB564397044A9BAE9739E02CEBD36 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF5C9E3525E475C99FFCD246273F6D3 }}

      - name: Deploy to UAT
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'uat'
          package: .

  calidad:
    runs-on: windows-latest
    needs: uat
    environment: calidad
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8DD3218090484411BF77757E7CFF0774 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8F2DB564397044A9BAE9739E02CEBD36 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF5C9E3525E475C99FFCD246273F6D3 }}

      - name: Deploy to Calidad
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'calidad'
          package: .

  produccion:
    runs-on: windows-latest
    needs: calidad
    environment: produccion
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8DD3218090484411BF77757E7CFF0774 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8F2DB564397044A9BAE9739E02CEBD36 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF5C9E3525E475C99FFCD246273F6D3 }}

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'Production'
          package: .
